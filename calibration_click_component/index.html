<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: transparent;
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }

    #stage {
      position: relative;
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(87, 157, 205, 0.3);
      border-radius: 14px;
      background: rgba(235, 246, 253, 0.72);
    }

    #image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      cursor: crosshair;
    }

    #stage.is-locked #image {
      cursor: default;
    }

    .marker {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 3px solid #f7fbff;
      border-radius: 50%;
      background: #1769aa;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .marker::after {
      content: attr(data-label);
      position: absolute;
      top: -24px;
      left: 50%;
      padding: 2px 6px;
      border-radius: 6px;
      color: #f7fbff;
      background: #0b2d4a;
      font-size: 11px;
      line-height: 1.3;
      white-space: nowrap;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div id="stage">
    <img
      id="image"
      src="data:image/gif;base64,R0lGODlhAQABAAAAACw="
      alt="用于尺度标定的条纹图像"
    >
  </div>
  <script>
    const stage = document.getElementById("stage");
    const image = document.getElementById("image");
    let currentArgs = {};

    function sendMessage(type, data = {}) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type }, data),
        "*"
      );
    }

    function setFrameHeight() {
      sendMessage("streamlit:setFrameHeight", {
        height: Math.ceil(stage.getBoundingClientRect().height)
      });
    }

    function renderMarkers(points, sourceWidth, sourceHeight) {
      stage.querySelectorAll(".marker").forEach((marker) => marker.remove());
      points.slice(0, 2).forEach((point, index) => {
        const marker = document.createElement("span");
        marker.className = "marker";
        marker.dataset.label = `点 ${index + 1}`;
        marker.style.left = `${point[0] / sourceWidth * 100}%`;
        marker.style.top = `${point[1] / sourceHeight * 100}%`;
        stage.appendChild(marker);
      });
    }

    function render(args) {
      currentArgs = args || {};
      const displayWidth = Math.max(240, Number(currentArgs.display_width) || 560);
      stage.style.maxWidth = `${displayWidth}px`;
      stage.classList.toggle("is-locked", Boolean(currentArgs.locked));
      image.src = currentArgs.image_data || "";
      image.onload = () => {
        renderMarkers(
          currentArgs.points || [],
          Number(currentArgs.source_width) || image.naturalWidth,
          Number(currentArgs.source_height) || image.naturalHeight
        );
        setFrameHeight();
      };
    }

    image.addEventListener("click", (event) => {
      if (currentArgs.locked) return;
      const rect = image.getBoundingClientRect();
      const sourceWidth = Number(currentArgs.source_width) || image.naturalWidth;
      const sourceHeight = Number(currentArgs.source_height) || image.naturalHeight;
      const x = Math.max(
        0,
        Math.min(sourceWidth - 1, Math.round((event.clientX - rect.left) / rect.width * sourceWidth))
      );
      const y = Math.max(
        0,
        Math.min(sourceHeight - 1, Math.round((event.clientY - rect.top) / rect.height * sourceHeight))
      );
      sendMessage("streamlit:setComponentValue", {
        value: { x, y },
        dataType: "json"
      });
    });

    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        render(event.data.args);
      }
    });

    window.addEventListener("resize", setFrameHeight);
    sendMessage("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
